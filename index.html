<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Asahi Linux Setup</title>
    <link rel="icon" href="assets/asahi-logomark.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="src/app.js"></script>
  </head>
  <body>
    <main
      id="installer"
      data-screen="welcome"
      class="installer"
      aria-labelledby="welcome-title"
      hidden
    >
      <header class="titlebar">
        <span class="titlebar-brand">
          <img data-asset="mark" alt="" />
          <span data-i18n="app.title"></span>
        </span>
        <button
          class="window-close"
          data-action="close"
          data-label="close.label"
        >
          <span aria-hidden="true">×</span>
        </button>
      </header>
      <div id="screen">
        <div id="welcome" class="split-body">
          <aside class="brand-panel"><img data-asset="logo" alt="" /></aside>
          <section class="welcome-main">
            <h1 id="welcome-title" tabindex="-1" data-i18n="welcome.title"></h1>
            <div class="welcome-copy">
              <p data-i18n="welcome.lead"></p>
              <p data-i18n="welcome.body"></p>
            </div>
            <div class="device-info">
              <p data-value="device"></p>
              <button
                class="text-button"
                data-action="device"
                data-i18n="device.details"
              ></button>
              <div class="version">
                <span data-i18n="version"></span>
                <button
                  class="text-button"
                  data-action="credits"
                  data-i18n="credits"
                ></button>
              </div>
            </div>
          </section>
        </div>
        <section id="edition" class="window-body" hidden>
          <div class="page-heading">
            <h1 id="edition-title" tabindex="-1" data-i18n="edition.title"></h1>
            <span class="step" data-i18n="wizard.step"></span>
          </div>
          <p class="intro" data-i18n="edition.intro"></p>
          <div class="choice-layout">
            <fieldset
              id="editions"
              class="option-list"
              data-label="edition.options"
            ></fieldset>
            <figure class="desktop-preview">
              <button class="desktop-image" data-action="preview">
                <img id="desktop-image" alt="" />
              </button>
              <div class="no-desktop" hidden>
                <span aria-hidden="true">&gt;_</span>
                <p id="desktop-empty"></p>
              </div>
              <figcaption aria-live="polite">
                <h2 id="edition-name"></h2>
                <p id="edition-description"></p>
                <button
                  class="text-button"
                  data-action="preview"
                  data-i18n="preview.enlarge"
                ></button>
              </figcaption>
            </figure>
          </div>
        </section>
        <section id="storage" class="window-body" hidden>
          <div class="page-heading">
            <h1 id="storage-title" tabindex="-1" data-i18n="storage.title"></h1>
            <span class="step" data-i18n="wizard.step"></span>
          </div>
          <p id="storage-status" class="intro" role="status" hidden></p>
          <button
            id="storage-retry"
            class="button"
            data-i18n="retry"
            hidden
          ></button>
          <div id="storage-data" hidden>
            <div class="drive-label">
              <svg viewBox="0 0 24 22" aria-hidden="true">
                <rect x="2" y="4" width="20" height="14" rx="2" />
                <path d="M2 12h20m-5 3h2m-6 0h1" />
              </svg>
              <span id="drive-name"></span>
            </div>
            <div
              id="disk-map"
              class="disk-map"
              role="group"
              data-label="storage.map"
            ></div>
            <div class="storage-chooser choice-layout">
              <fieldset
                id="destinations"
                class="option-list"
                data-label="storage.locations"
              ></fieldset>
              <section
                class="storage-settings"
                aria-labelledby="operation-title"
              >
                <h2 id="operation-title"></h2>
                <label for="size" data-i18n="storage.size"></label>
                <div class="size-control">
                  <input
                    id="size"
                    type="number"
                    required
                    aria-describedby="size-limits size-error"
                  />
                  <span data-i18n="unit.gb"></span>
                </div>
                <p class="field-help" id="size-limits"></p>
                <p class="field-error" id="size-error" hidden></p>
                <p id="storage-effect" class="storage-effect"></p>
                <div class="storage-name">
                  <label for="name" data-i18n="storage.name"></label>
                  <input
                    id="name"
                    type="text"
                    required
                    maxlength="40"
                    autocomplete="off"
                    aria-describedby="name-help name-error"
                  />
                  <p
                    class="field-help"
                    id="name-help"
                    data-i18n="storage.nameHelp"
                  ></p>
                  <p
                    class="field-error"
                    id="name-error"
                    data-i18n="storage.nameError"
                    hidden
                  ></p>
                </div>
              </section>
            </div>
            <p
              id="no-locations"
              class="intro"
              data-i18n="storage.none"
              hidden
            ></p>
          </div>
        </section>
        <section id="review" class="window-body" hidden>
          <div class="page-heading">
            <h1 id="review-title" tabindex="-1" data-i18n="review.title"></h1>
            <span class="step" data-i18n="wizard.step"></span>
          </div>
          <p class="intro" data-i18n="review.intro"></p>
          <table class="review-table">
            <tbody>
              <tr>
                <th scope="row" data-i18n="review.name"></th>
                <td data-value="name"></td>
              </tr>
              <tr>
                <th scope="row" data-i18n="review.system"></th>
                <td data-value="system"></td>
              </tr>
              <tr>
                <th scope="row" data-i18n="review.edition"></th>
                <td data-value="edition"></td>
              </tr>
              <tr>
                <th scope="row" data-i18n="review.location"></th>
                <td data-value="location"></td>
              </tr>
              <tr>
                <th scope="row" data-i18n="review.size"></th>
                <td data-value="size"></td>
              </tr>
            </tbody>
          </table>
          <div class="power-note">
            <svg viewBox="0 0 24 26" aria-hidden="true">
              <path d="M8 2v7m8-7v7M6 8h12v5a6 6 0 0 1-12 0V8Zm6 11v6" />
            </svg>
            <span data-i18n="review.power"></span>
          </div>
        </section>
        <div id="progress" class="split-body" hidden>
          <aside class="brand-panel"><img data-asset="logo" alt="" /></aside>
          <section class="progress-main">
            <h1
              id="progress-title"
              tabindex="-1"
              data-i18n="progress.title"
            ></h1>
            <p class="intro">
              <span data-i18n="progress.power"></span>
              <span
                id="resize-warning"
                data-i18n="progress.resize"
                hidden
              ></span>
            </p>
            <div class="progress-stage">
              <strong id="progress-label" role="status"></strong>
              <span id="progress-value"></span>
            </div>
            <progress
              id="progress-bar"
              max="100"
              aria-labelledby="progress-label"
            ></progress>
            <p id="progress-step" class="progress-meta"></p>
            <p id="progress-error" class="field-error" role="alert" hidden></p>
            <button
              id="progress-retry"
              class="text-button"
              data-i18n="progress.retry"
              hidden
            ></button>
            <details class="logs">
              <summary data-i18n="progress.details"></summary>
              <pre
                id="progress-log"
                tabindex="0"
                data-label="progress.details"
              ></pre>
            </details>
            <div class="waiting-note">
              <p data-i18n="progress.waiting"></p>
              <button
                class="text-button"
                data-action="about"
                data-i18n="about.title"
              ></button>
            </div>
          </section>
        </div>
        <div id="complete" class="split-body" hidden>
          <aside class="brand-panel"><img data-asset="logo" alt="" /></aside>
          <section class="complete-main">
            <h1
              id="complete-title"
              tabindex="-1"
              data-i18n="complete.title"
            ></h1>
            <p class="intro" data-i18n="complete.intro"></p>
            <ol class="finish-steps" role="list">
              <li>
                <strong data-i18n="complete.off"></strong>
                <p data-i18n="complete.wait"></p>
              </li>
              <li>
                <strong data-i18n="complete.hold"></strong>
                <p data-i18n="complete.loading"></p>
              </li>
              <li>
                <strong id="complete-selection"></strong>
                <p data-i18n="complete.password"></p>
              </li>
            </ol>
            <p class="photo-note" data-i18n="complete.photo"></p>
            <section class="telemetry" aria-labelledby="metrics-label">
              <div class="telemetry-heading">
                <p id="metrics-label" data-i18n="metrics.question"></p>
                <button
                  class="text-button"
                  data-action="metrics"
                  data-i18n="metrics.details"
                ></button>
              </div>
              <div class="telemetry-controls">
                <fieldset
                  id="metrics-options"
                  class="metrics-options"
                  aria-labelledby="metrics-label"
                  aria-describedby="metrics-hint"
                >
                  <label>
                    <input type="radio" name="metrics" value="yes" required />
                    <span class="button" data-i18n="yes"></span>
                  </label>
                  <label>
                    <input type="radio" name="metrics" value="no" required />
                    <span class="button" data-i18n="no"></span>
                  </label>
                </fieldset>
                <p
                  id="metrics-hint"
                  class="field-help"
                  data-i18n="metrics.choose"
                ></p>
              </div>
            </section>
            <p id="shutdown-error" class="field-error" role="alert" hidden></p>
          </section>
        </div>
      </div>
      <footer class="window-footer">
        <button
          class="button quiet"
          data-action="close"
          data-i18n="cancel"
        ></button>
        <div class="footer-actions">
          <button
            class="button"
            data-action="back"
            data-i18n="back"
            hidden
          ></button>
          <button
            class="button primary"
            data-action="next"
            data-i18n="next"
          ></button>
        </div>
      </footer>
    </main>
    <p id="startup-error" class="startup-error" role="alert" hidden></p>
    <noscript>This installer needs JavaScript enabled.</noscript>
    <dialog id="dialog" aria-labelledby="dialog-title">
      <div class="dialog-body">
        <h2 id="dialog-title"></h2>
        <div id="dialog-content"></div>
      </div>
      <form method="dialog">
        <button class="button primary" data-i18n="close" autofocus></button>
      </form>
    </dialog>
    <template id="option">
      <label class="option">
        <input type="radio" />
        <span></span>
      </label>
    </template>
    <template id="partition">
      <button class="disk-region">
        <span class="region-name"></span>
        <small class="region-size"></small>
        <span class="tooltip" role="tooltip"></span>
      </button>
    </template>
  </body>
</html>
