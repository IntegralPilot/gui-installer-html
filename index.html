<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Asahi Linux Setup</title>
    <link rel="icon" href="assets/asahi-logomark.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="src/app.js"></script>
  </head>
  <body>
    <main
      id="installer"
      data-screen="welcome"
      class="installer"
      aria-labelledby="welcome-title"
      hidden
    >
      <header class="titlebar">
        <span class="titlebar-brand">
          <img data-asset="mark" alt="" />
          <span data-i18n="app.title"></span>
        </span>
        <button
          class="window-close"
          data-action="close"
          data-label="close.label"
        >
          <span aria-hidden="true">×</span>
        </button>
      </header>
      <div id="screen">
        <div id="welcome" class="split-body">
          <aside class="brand-panel"><img data-asset="logo" alt="" /></aside>
          <section class="welcome-main">
            <h1 id="welcome-title" tabindex="-1" data-i18n="welcome.title"></h1>
            <div class="welcome-copy">
              <p data-i18n="welcome.lead"></p>
              <p data-i18n="welcome.body"></p>
            </div>
            <div class="device-info">
              <p data-value="device"></p>
              <button
                class="text-button"
                data-action="device"
                data-i18n="device.details"
              ></button>
              <div class="version">
                <span data-i18n="version"></span>
                <button
                  class="text-button"
                  data-action="credits"
                  data-i18n="credits"
                ></button>
              </div>
            </div>
          </section>
        </div>
        <section id="edition" class="window-body" hidden>
          <div class="page-heading">
            <h1 id="edition-title" tabindex="-1" data-i18n="edition.title"></h1>
            <span class="step" data-i18n="wizard.step"></span>
          </div>
          <p class="intro" data-i18n="edition.intro"></p>
          <div class="choice-layout">
            <fieldset
              id="editions"
              class="option-list"
              data-label="edition.options"
            ></fieldset>
            <figure class="desktop-preview">
              <button class="desktop-image" data-action="preview">
                <img id="desktop-image" alt="" />
              </button>
              <div class="no-desktop" hidden>
                <span aria-hidden="true">&gt;_</span>
                <p id="desktop-empty"></p>
              </div>
              <figcaption aria-live="polite">
                <h2 id="edition-name"></h2>
                <p id="edition-description"></p>
                <button
                  class="text-button"
                  data-action="preview"
                  data-i18n="preview.enlarge"
                ></button>
              </figcaption>
            </figure>
          </div>
        </section>
      </div>
      <footer class="window-footer">
        <button
          class="button quiet"
          data-action="close"
          data-i18n="cancel"
        ></button>
        <div class="footer-actions">
          <button
            class="button"
            data-action="back"
            data-i18n="back"
            hidden
          ></button>
          <button
            class="button primary"
            data-action="next"
            data-i18n="next"
          ></button>
        </div>
      </footer>
    </main>
    <p id="startup-error" class="startup-error" role="alert" hidden></p>
    <noscript>This installer needs JavaScript enabled.</noscript>
    <dialog id="dialog" aria-labelledby="dialog-title">
      <div class="dialog-body">
        <h2 id="dialog-title"></h2>
        <div id="dialog-content"></div>
      </div>
      <form method="dialog">
        <button class="button primary" data-i18n="close" autofocus></button>
      </form>
    </dialog>
    <template id="edition-option">
      <label class="option">
        <input type="radio" name="edition" />
        <span></span>
      </label>
    </template>
  </body>
</html>
